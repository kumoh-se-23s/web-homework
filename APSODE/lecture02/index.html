    <form action="#" method="post">

    <h1>금오공과대학교 가족회사 가입 신청서</h1>
    <form action="#" method="post">
        <div>
            <fieldset>
                <legend>기업현황</legend>
                <label><strong>회사명</strong><input type="text" name="" id=""></label>
                <label><strong>대표자</strong><input type="text" name="" id=""></label>
                <label><input type="radio" name="radio-btn-sex" id="">남</label>
                <label><input type="radio" name="radio-btn-sex" id="">여</label>
                <br>
                <label><strong>사업자 번호</strong><input type="text" placeholder="NNN-NN-NNNN" name="" id=""></label>
                <label><strong>사업자 등록일</strong><input type="date" name="" id=""></label>
                <br>
                <label><strong>주소</strong><input type="text" name="" id=""></label>
                <label><strong>전화번호</strong><input type="tel" name="" id=""></label>
                <br>
                <label><strong>홈페이지</strong><input type="text" name="" id=""></label>
                <br>
                <label><strong>근무시간</strong><input type="time" name="" id="">~<input type="time" name="" id=""></label>
                <br>
                <label><strong>기업형태</strong></label>
                <label>대기업<input type="radio" name="company-size" id=""></label>
                <label>중견기업<input type="radio" name="company-size" id=""></label>
                <label>중소기업<input type="radio" name="company-size" id=""></label>
                <br>
                <label><strong>전년도매출액</strong><input type="text" placeholder="백만원" name="" id=""></label>
            </fieldset>
        </div>

        <br>

        <div>
            <fieldset>
                <legend>가입내용</legend>
                <label><strong>구분(연회비)</strong></label>
                <label>1st(100만원)<input type="radio" name="year-pay" id=""></label>
                <label>2nd(60만원)<input type="radio" name="year-pay" id=""></label>
                <label>3rd(30만원)<input type="radio" name="year-pay" id=""></label>
                <label>4th(무료)<input type="radio" name="year-pay" id=""></label>
                <br>
                <label><strong>멘토교수</strong></label>
                <label>학과
                    <select>
                        <option>컴퓨터 소프트웨어 학과</option>
                        <option>컴퓨터 소프트웨어 학과</option>
                        <option>컴퓨터 소프트웨어 학과</option>
                        <option>컴퓨터 소프트웨어 학과</option>
                        <option selected>컴퓨터 소프트웨어 학과</option>
                        <option>컴퓨터 소프트웨어 학과</option>
                    </select>
                </label>
                <label><strong>성명</strong><input type="text" name="" id=""></label>
                <hr>
                <label><strong>산학협력희망분야</strong></label>
                <label>기술개발<input type="checkbox" name="tag"></label>
                <label>기술지도<input type="checkbox" name="tag"></label>
                <label>현장실습<input type="checkbox" name="tag"></label>
                <br>
                <label>재직자교육<input type="checkbox" name="tag"></label>
                <label>공용장비 활용<input type="checkbox" name="tag"></label>
                <label>기타<input type="text" name=""></label>
            </fieldset>
            <div>
                <input type="submit" name="sub-btn" value="제출하기">
                <input type="submit" name="sub-btn" value="다시입력">
            </div>


        </div>
    </form>
