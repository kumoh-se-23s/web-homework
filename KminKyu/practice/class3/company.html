<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>실습</h1>
    <h1>금오공과대학교 가족회사 가입신청서</h1>
    <form>
        <fieldset style="width:auto">
            <legend>기업현황</legend>
            <div>
                <label>회사명<input type="text"></label>
                <label>대표자<input type="text"></label>
                <label><input type="radio" name="gender" value="남">남</label>
                <label><input type="radio" name="gender" value="여">여</label>
            </div>
            <div>
                <label>사업자 번호<input type="text" placeholder="NNN-NN-NNNN"></label>
                <label>개업일<input type="date"></label>
            </div>
            <div>
                <label>주소 <input type="text"></label>
                <label>전화번호 <input type="tel"></label>
            </div>
            <div>
                <label>홈페이지 <input type="text"></label>
            </div>
            <div>
                <label>근무시간 <input type = "time"></label>
                <label>~<input type = "time"></label>
            </div>
            <div>
                <label>기업형태</label>
                <label>대기업<input type="radio" name="company"></label>
                <label>중견기업<input type="radio"name="company"></label>
                <label>중소기업<input type="radio" name="company"></label>
            </div>
            <div>
                <label>전년도매출액<input type="text" placeholder="백만원"></label>
            </div>
        </fieldset>
    </form>

    <form>
        <fieldset style="width:auto">
            <legend>가입내용</legend>
            <div>
                <label> 구분(연회비)</label>
                <label>1st(100만원)<input type="radio" name="money"></label>
                <label>2nd(60만원)<input type="radio" name="money"></label>
                <label>3rd(30만원)<input type="radio" name="money"></label>
                <label>4th(무료)<input type="radio" name="money"></label>
            </div>
            <div>
                <label>멘토교수</label>
                <label for="stu">학과</label>
                <select id="stu">
                    <optgroup label="공과대학">
                        <option value="computer-soft" selected>컴퓨터소프트웨어공학과</option>
                        <option value="computer">컴퓨터공학과</option>
                        <option value="archi">건축학과</option>
                    </optgroup>
                </select>
                <label>성명<input type="text"></label>
            </div>
            <hr>
            <div>
                <label>산학협력희망분야</label>
            </div>
            <div>
                <label>기술개발<input type="checkbox" name="work"></label>
                <label>기술지도<input type="checkbox" name="work"></label>
                <label>현장실습<input type="checkbox" name="work"></label>
            </div>
            <div>
                <label>재직자교육<input type="checkbox" name="work"></label>
                <label>공용장비활용<input type="checkbox" name="work"></label>
                <label>기타<input type="text" name="work"></label>
            </div>
        </fieldset>
        <input type="submit" value="제출">
        <input type="reset" value="다시입력">
    </form>


</body>
</html>
